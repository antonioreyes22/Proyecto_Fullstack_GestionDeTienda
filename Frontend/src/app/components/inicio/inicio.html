<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Bienvenido</title>
</head>
<body>
    <h1>Bienvenido a Urban Street Flow</h1>

    <p>Aquí podras encontrar prendas de todo tipo, pero sobre todo aquellas con un toque callejero que destaquen entre
        la multitud.
    </p>
    <div class="fIzq" (click)="next()"><i class="fa-solid fa-arrow-left"></i></div>
    <div class="fDer" (click)="before()"><i class="fa-solid fa-arrow-right"></i></div>
    <section class="galeria">
        <img [src]="izquierda" alt="imagen">
        <img [src]="centro" alt="imagen">
        <img [src]="derecha" alt="imagen">
    </section>

    <section class="gridSection">
        <ul>
            <li>Camisas</li>
            <li>Chaquetas</li>
            <li>Pantalones</li>
            <li>Zapatos</li>
            <li>Sombreros</li>
            <li>Pulseras</li>
        </ul>
    </section>
</body>
</html>
